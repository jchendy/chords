<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Progression Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg: #191817;
    --panel: #201e1c;
    --line: #35322e;
    --ink: #eceae4;
    --muted: #9a9284;
    --accent: #8f7fd1;
    --accent-hi: #a99ae0;
    --on-accent: #1b1630;
  }

  *{ box-sizing: border-box; }
  [hidden]{ display: none !important; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin:0;
    min-height:100vh;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  .app{
    width:100%;
    max-width: none;
    display:flex;
    flex-direction:column;
    gap: 16px;
  }

  /* ---- sections ---- */
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }

  /* ---- primary actions ---- */
  .primary{
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    display:block;
    width:100%;
    font-family: inherit;
    font-weight:600;
    font-size: 0.98rem;
    color: var(--on-accent);
    background: var(--accent);
    border: none;
    border-radius: 9px;
    padding: 13px 18px;
    transition: background 0.15s ease;
  }
  .primary:hover{ background: var(--accent-hi); }
  .primary:focus-visible{
    outline: 2px solid var(--accent-hi);
    outline-offset: 2px;
  }

  /* ---- settings list ---- */
  .primary + .settings{ margin-top: 18px; }
  .settings + .primary{ margin-top: 18px; }

  .setting{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap: 10px 16px;
    padding: 13px 0;
    border-top: 1px solid var(--line);
  }
  .setting:first-child{ border-top:none; padding-top: 2px; }
  .setting:last-child{ padding-bottom: 2px; }

  .setting-label{
    font-size: 0.9rem;
    color: var(--ink);
  }

  label.setting{ cursor:pointer; }

  .setting-control{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-left:auto;
  }

  .setting-value{
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 58px;
    text-align: right;
  }

  /* ---- secondary controls ---- */
  .segmented{ display:flex; flex-wrap:wrap; gap: 6px; }

  .seg-btn{
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    font-family: inherit;
    font-weight:500;
    font-size: 0.82rem;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 11px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .seg-btn:hover{ border-color: var(--accent); }
  .seg-btn.active{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .seg-btn:focus-visible{
    outline: 2px solid var(--accent-hi);
    outline-offset: 2px;
  }

  .stepper{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .step-btn{
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    width: 34px;
    height: 34px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: inherit;
    font-size: 1.1rem;
    line-height:1;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    transition: border-color 0.12s ease;
  }
  .step-btn:hover{ border-color: var(--accent); }
  .step-btn:focus-visible{
    outline: 2px solid var(--accent-hi);
    outline-offset: 2px;
  }
  .step-value{
    min-width: 18px;
    text-align:center;
    font-weight:600;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"]{
    width: 150px;
    max-width: 44vw;
    accent-color: var(--accent);
  }

  input[type="checkbox"]{
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor:pointer;
  }

  /* ---- progression display ---- */
  .display{
    text-align:center;
    padding: 32px 20px;
  }

  .key{
    margin: 0 0 14px;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.05rem, 3.5vw, 1.3rem);
    color: var(--muted);
  }

  .playmini{
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    display:inline-block;
    margin: 0 0 24px;
    font-family: inherit;
    font-weight:600;
    font-size: 0.82rem;
    color: var(--on-accent);
    background: var(--accent);
    border: none;
    border-radius: 7px;
    padding: 7px 20px;
    transition: background 0.15s ease;
  }
  .playmini:hover{ background: var(--accent-hi); }
  .playmini:focus-visible{
    outline: 2px solid var(--accent-hi);
    outline-offset: 2px;
  }

  .measure-readout{
    margin: 16px 0 0;
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .measure-readout:empty{ margin: 0; }

  .chords{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    flex-wrap:nowrap;
    gap: clamp(8px, 2.5vw, 18px);
  }
  .chords.tight{ gap: clamp(12px, 4vw, 26px); }

  .chord{
    flex: 1 1 0;
    min-width:0;
    padding-bottom: 8px;
    border-bottom: 2px solid transparent;
    font-size: clamp(1rem, calc(24vw / var(--n, 4)), 2.15rem);
    opacity:0;
    animation: fade 0.4s ease forwards;
    transition: opacity 0.15s ease, border-color 0.15s ease;
  }
  .chord.dim{ opacity: 0.3; }
  .chord.active{ border-bottom-color: var(--accent); }

  .chord-name{
    display:block;
    font-family: 'Fraunces', Georgia, serif;
    font-weight:600;
    line-height:1;
    letter-spacing: -0.01em;
  }
  .chord-numeral{
    display:block;
    margin-top: 0.34em;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight:600;
    font-style: italic;
    font-size: 0.46em;
    line-height:1;
    color: var(--accent);
    letter-spacing: 0.01em;
  }

  @keyframes fade{
    from{ opacity:0; transform: translateY(4px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .chord{ animation:none; opacity:1; }
  }

  /* ---- fretboard ---- */
  .fret-scroll{ overflow-x:auto; margin-top: 6px; }
  .fret-scroll svg{ display:block; width:100%; min-width: 440px; max-width: 820px; margin: 0 auto; height:auto; }

  .fret-string, .fret-wire{ stroke: var(--line); stroke-width: 1; }
  .fret-nut{ stroke: var(--muted); stroke-width: 3; }
  .fret-inlay{ fill: #6b655b; }
  .fret-num, .string-label{ fill: var(--muted); font: 500 10px 'Inter', system-ui, sans-serif; }

  .shape-line{
    fill: none;
    stroke-width: 2;
    stroke-opacity: 0.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .note-dot text{ font: 600 8.5px 'Inter', system-ui, sans-serif; fill: #16211e; }
  .dot-ring{ stroke: var(--ink); stroke-width: 1.6; }
  .note-dot.dim circle{ stroke: #5a554c; stroke-width: 1; }
  .note-dot.dim text{ font-size: 7.5px; font-weight: 500; fill: var(--muted); }

  .caged-legend{
    display:flex;
    flex-wrap:wrap;
    gap: 7px 14px;
    margin-top: 14px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .caged-legend span{ display:inline-flex; align-items:center; gap: 6px; }
  .caged-legend i{ width: 11px; height: 11px; border-radius: 50%; display:inline-block; flex:none; }
  .caged-legend i.ring{ background: transparent; border: 1.6px solid var(--ink); }
  .caged-legend em{ font-style: normal; opacity: 0.7; margin-left: 3px; }
</style>
</head>
<body>

<div class="app">

  <section class="panel">
    <div class="settings">
      <div class="setting">
        <span class="setting-label">Mode</span>
        <div class="segmented" id="modeGroup">
          <button type="button" class="seg-btn" data-value="major">Major</button>
          <button type="button" class="seg-btn" data-value="minor">Minor</button>
          <button type="button" class="seg-btn active" data-value="random">Random</button>
        </div>
      </div>
      <div class="setting">
        <span class="setting-label">Number of chords</span>
        <div class="stepper">
          <button type="button" class="step-btn" id="chordCountDown" aria-label="Fewer chords">−</button>
          <span class="step-value" id="chordCountValue">3</span>
          <button type="button" class="step-btn" id="chordCountUp" aria-label="More chords">+</button>
        </div>
      </div>
      <label class="setting">
        <span class="setting-label">Common chords only</span>
        <input type="checkbox" id="commonToggle" checked>
      </label>
    </div>
    <button id="genBtn" class="primary">New progression</button>
  </section>

  <section class="panel display">
    <p class="key" id="keyReadout">Key of —</p>
    <button id="playBtn2" class="playmini" type="button">Play</button>
    <div class="chords" id="chords"></div>
    <p class="measure-readout" id="measureReadout"></p>
  </section>

  <section class="panel">
    <div class="setting">
      <span class="setting-label">Fretboard</span>
      <div class="segmented" id="fretModeGroup">
        <button type="button" class="seg-btn active" data-value="roots">Root notes</button>
        <button type="button" class="seg-btn" data-value="caged">CAGED chords</button>
        <button type="button" class="seg-btn" data-value="penta">CAGED pentatonic</button>
      </div>
    </div>
    <div class="setting" id="cagedChordRow" hidden>
      <span class="setting-label">Chord</span>
      <div class="segmented" id="cagedChordGroup"></div>
    </div>
    <div class="fret-scroll">
      <svg id="fretboard" viewBox="0 0 520 172" role="img" aria-label="Guitar fretboard"></svg>
    </div>
    <div class="caged-legend" id="cagedLegend"></div>
  </section>

  <section class="panel">
    <button id="playBtn" class="primary">Play</button>
    <div class="settings">
      <div class="setting">
        <span class="setting-label">Tempo</span>
        <div class="setting-control">
          <input type="range" id="tempo" min="40" max="200" value="60">
          <span class="setting-value" id="tempoVal">60 BPM</span>
        </div>
      </div>
      <div class="setting">
        <span class="setting-label">Measures per chord</span>
        <div class="stepper">
          <button type="button" class="step-btn" id="measuresDown" aria-label="Fewer measures per chord">−</button>
          <span class="step-value" id="measuresValue">2</span>
          <button type="button" class="step-btn" id="measuresUp" aria-label="More measures per chord">+</button>
        </div>
      </div>
      <div class="setting">
        <span class="setting-label">Note value</span>
        <div class="segmented" id="noteValueGroup">
          <button type="button" class="seg-btn active" data-value="1">Quarter</button>
          <button type="button" class="seg-btn" data-value="2">Half</button>
          <button type="button" class="seg-btn" data-value="4">Whole</button>
        </div>
      </div>
      <label class="setting">
        <span class="setting-label">Count-in (4 beats)</span>
        <input type="checkbox" id="countInToggle" checked>
      </label>
      <label class="setting">
        <span class="setting-label">Metronome click</span>
        <input type="checkbox" id="clickToggle" checked>
      </label>
      <label class="setting">
        <span class="setting-label">Roots only</span>
        <input type="checkbox" id="rootOnlyToggle">
      </label>
    </div>
  </section>

</div>

<script>
  const MAJOR_KEYS = {
    'C':  ['C','D','E','F','G','A','B'],
    'G':  ['G','A','B','C','D','E','F#'],
    'D':  ['D','E','F#','G','A','B','C#'],
    'A':  ['A','B','C#','D','E','F#','G#'],
    'E':  ['E','F#','G#','A','B','C#','D#'],
    'B':  ['B','C#','D#','E','F#','G#','A#'],
    'Gb': ['Gb','Ab','Bb','Cb','Db','Eb','F'],
    'Db': ['Db','Eb','F','Gb','Ab','Bb','C'],
    'Ab': ['Ab','Bb','C','Db','Eb','F','G'],
    'Eb': ['Eb','F','G','Ab','Bb','C','D'],
    'Bb': ['Bb','C','D','Eb','F','G','A'],
    'F':  ['F','G','A','Bb','C','D','E'],
  };

  const MINOR_KEYS = {
    'A':  ['A','B','C','D','E','F','G'],
    'E':  ['E','F#','G','A','B','C','D'],
    'B':  ['B','C#','D','E','F#','G','A'],
    'F#': ['F#','G#','A','B','C#','D','E'],
    'C#': ['C#','D#','E','F#','G#','A','B'],
    'G#': ['G#','A#','B','C#','D#','E','F#'],
    'Eb': ['Eb','F','Gb','Ab','Bb','Cb','Db'],
    'Bb': ['Bb','C','Db','Eb','F','Gb','Ab'],
    'F':  ['F','G','Ab','Bb','C','Db','Eb'],
    'C':  ['C','D','Eb','F','G','Ab','Bb'],
    'G':  ['G','A','Bb','C','D','Eb','F'],
    'D':  ['D','E','F','G','A','Bb','C'],
  };

  const MAJOR_QUALITY  = ['maj','min','min','maj','maj','min','dim'];
  const MAJOR_NUMERALS = ['I','ii','iii','IV','V','vi','vii°'];
  const MINOR_QUALITY  = ['min','dim','maj','min','min','maj','maj'];
  const MINOR_NUMERALS = ['i','ii°','III','iv','v','VI','VII'];
  const SUFFIX = { maj: '', min: 'm', dim: '°' };

  // raised 7th (leading tone) of each minor key, used to turn v into V
  const LEADING_TONE = {
    'A': 'G#', 'E': 'D#', 'B': 'A#', 'F#': 'E#', 'C#': 'B#', 'G#': 'G',
    'Eb': 'D', 'Bb': 'A', 'F': 'E', 'C': 'B', 'G': 'F#', 'D': 'C#',
  };

  // scale-degree indices kept when "common chords only" is on
  const MAJOR_COMMON = [0, 1, 3, 4, 5];   // I, ii, IV, V, vi
  const MINOR_COMMON = [0, 3, 4, 5, 6];   // i, iv, v/V, VI, VII

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildDiatonicChords(mode, tonic){
    const scale = mode === 'major' ? MAJOR_KEYS[tonic] : MINOR_KEYS[tonic];
    const qualities = mode === 'major' ? MAJOR_QUALITY : MINOR_QUALITY;
    const numerals = mode === 'major' ? MAJOR_NUMERALS : MINOR_NUMERALS;
    return scale.map((note, i) => ({
      note,
      third: scale[(i + 2) % 7],
      fifth: scale[(i + 4) % 7],
      quality: qualities[i],
      numeral: numerals[i],
      name: note + SUFFIX[qualities[i]],
    }));
  }

  function generateProgression(commonOnly, requestedCount){
    const mode = modeSetting === 'random'
      ? (Math.random() < 0.5 ? 'major' : 'minor')
      : modeSetting;
    const keys = Object.keys(mode === 'major' ? MAJOR_KEYS : MINOR_KEYS);
    const tonic = pick(keys);
    const chords = buildDiatonicChords(mode, tonic);

    if (mode === 'minor' && Math.random() < 0.5){
      // swap the natural-minor v for the major dominant V (harmonic minor)
      const five = chords[4];
      chords[4] = {
        note: five.note,
        third: LEADING_TONE[tonic],
        fifth: five.fifth,
        quality: 'maj',
        numeral: 'V',
        name: five.note,
      };
    }

    const commonIndices = mode === 'major' ? MAJOR_COMMON : MINOR_COMMON;
    const pool = commonOnly ? chords.filter((_, i) => commonIndices.includes(i)) : chords;

    const root = pool[0];                  // always the tonic (I or i)
    const others = shuffle(pool.slice(1));  // the other diatonic triads in the pool
    const count = Math.max(1, Math.min(requestedCount, pool.length));
    const selected = others.slice(0, count - 1);
    const progression = shuffle([root, ...selected]);

    return { mode, tonic, progression };
  }

  let currentProgression = [];
  let chordCount = 3;
  let modeSetting = 'random';   // 'major' | 'minor' | 'random'

  function render(){
    const { mode, tonic, progression } = generateProgression(commonToggle.checked, chordCount);
    currentProgression = progression;

    document.getElementById('keyReadout').textContent =
      `Key of ${tonic} ${mode === 'major' ? 'major' : 'minor'}`;

    const chordsEl = document.getElementById('chords');
    chordsEl.style.setProperty('--n', progression.length);
    chordsEl.classList.toggle('tight', progression.length === 2);
    chordsEl.innerHTML = '';
    progression.forEach((chord, i) => {
      const item = document.createElement('div');
      item.className = 'chord';
      item.style.animationDelay = `${i * 70}ms`;
      item.innerHTML = `
        <span class="chord-name">${chord.name}</span>
        <span class="chord-numeral">${chord.numeral}</span>
      `;
      chordsEl.appendChild(item);
    });

    rebuildCagedPicker();
    renderFretboard();

    // keep the playback loop in sync with the new set of chords
    resetPlaybackCursor();
  }

  document.getElementById('genBtn').addEventListener('click', render);

  // ---------- Playback ----------

  const SEMITONE = {
    C:0, 'C#':1, Db:1, D:2, 'D#':3, Eb:3, E:4, 'E#':5, F:5,
    'F#':6, Gb:6, G:7, 'G#':8, Ab:8, A:9, 'A#':10, Bb:10, B:11, 'B#':0, Cb:11,
  };
  const ROOT_OCTAVE = 3;

  function noteFreq(name, octave){
    const midi = (octave + 1) * 12 + SEMITONE[name];
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function chordFrequencies(chord){
    // stack root/third/fifth upward in pitch, wrapping octaves as needed
    const rootSemi = SEMITONE[chord.note];
    const thirdSemi = SEMITONE[chord.third];
    const fifthSemi = SEMITONE[chord.fifth];

    const thirdOctave = ROOT_OCTAVE + (thirdSemi <= rootSemi ? 1 : 0);
    const fifthOctave = thirdOctave + (fifthSemi <= thirdSemi ? 1 : 0);

    return [
      noteFreq(chord.note, ROOT_OCTAVE),
      noteFreq(chord.third, thirdOctave),
      noteFreq(chord.fifth, fifthOctave),
    ];
  }

  let audioCtx = null;
  let masterGain = null;
  let hihatGain = null;
  let noiseBuffer = null;

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.3;
      const tone = audioCtx.createBiquadFilter();
      tone.type = 'lowpass';
      tone.frequency.value = 3200;
      tone.Q.value = 0.7;
      masterGain.connect(tone);
      tone.connect(audioCtx.destination);

      // separate percussion chain so the hi-hat's high end isn't
      // swallowed by the piano voice's lowpass filter
      hihatGain = audioCtx.createGain();
      hihatGain.gain.value = 0.45;
      hihatGain.connect(audioCtx.destination);

      const bufferSize = Math.floor(audioCtx.sampleRate * 0.2);
      noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++){
        data[i] = Math.random() * 2 - 1;
      }
    }
  }

  // simple additive "piano" tone: a handful of decaying harmonics
  const HARMONICS = [
    { mult: 1, gain: 0.50 },
    { mult: 2, gain: 0.28 },
    { mult: 3, gain: 0.13 },
    { mult: 4, gain: 0.06 },
    { mult: 5, gain: 0.03 },
  ];

  function playNote(freq, time, duration, velocity){
    const envelope = audioCtx.createGain();
    envelope.gain.setValueAtTime(0.0001, time);
    envelope.gain.exponentialRampToValueAtTime(0.85 * velocity, time + 0.006);
    envelope.gain.exponentialRampToValueAtTime(0.0001, time + duration);
    envelope.connect(masterGain);

    HARMONICS.forEach(h => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq * h.mult;
      const hGain = audioCtx.createGain();
      hGain.gain.value = h.gain;
      osc.connect(hGain).connect(envelope);
      osc.start(time);
      osc.stop(time + duration + 0.05);
    });
  }

  function playChord(chord, time, duration, velocity){
    chordFrequencies(chord).forEach(freq => playNote(freq, time, duration, velocity));
  }

  function playHiHat(time){
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;

    const highpass = audioCtx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 8000;

    const envelope = audioCtx.createGain();
    envelope.gain.setValueAtTime(0.0001, time);
    envelope.gain.exponentialRampToValueAtTime(1, time + 0.002);
    envelope.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);

    src.connect(highpass).connect(envelope).connect(hihatGain);
    src.start(time);
    src.stop(time + 0.08);
  }

  const tempoInput = document.getElementById('tempo');
  const tempoVal = document.getElementById('tempoVal');
  const playBtn = document.getElementById('playBtn');
  const playBtn2 = document.getElementById('playBtn2');
  const commonToggle = document.getElementById('commonToggle');
  const clickToggle = document.getElementById('clickToggle');
  const countInToggle = document.getElementById('countInToggle');
  const rootOnlyToggle = document.getElementById('rootOnlyToggle');
  const measureReadout = document.getElementById('measureReadout');

  const chordCountValue = document.getElementById('chordCountValue');
  const measuresValue = document.getElementById('measuresValue');

  let measuresPerChord = 2;
  let noteBeats = 1;

  commonToggle.addEventListener('change', render);

  function setChordCount(n){
    chordCount = Math.max(1, Math.min(7, n));
    chordCountValue.textContent = chordCount;
    render();
  }
  document.getElementById('chordCountDown').addEventListener('click', () => {
    if (chordCount <= 1) return;
    setChordCount(chordCount - 1);
  });
  document.getElementById('chordCountUp').addEventListener('click', () => {
    if (chordCount >= 7) return;
    setChordCount(chordCount + 1);
  });

  function setMeasures(n){
    measuresPerChord = Math.max(1, Math.min(8, n));
    measuresValue.textContent = measuresPerChord;
  }
  document.getElementById('measuresDown').addEventListener('click', () => setMeasures(measuresPerChord - 1));
  document.getElementById('measuresUp').addEventListener('click', () => setMeasures(measuresPerChord + 1));

  document.querySelectorAll('#noteValueGroup .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#noteValueGroup .seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      noteBeats = Number(btn.dataset.value);
    });
  });

  document.querySelectorAll('#modeGroup .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#modeGroup .seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      modeSetting = btn.dataset.value;
      render();
    });
  });

  // ---------- Fretboard ----------

  const STRING_TUNING = [4, 11, 7, 2, 9, 4];        // index 0 = high e (top) ... 5 = low E (bottom)
  const STRING_LABELS = ['e', 'B', 'G', 'D', 'A', 'E'];
  const FRET_COUNT = 15;

  // CAGED shape templates: fret offsets per string (index 0 = high e ... 5 = low E),
  // relative to the shape's anchor fret on string `ref`. null = string not played.
  const CAGED_MAJOR = {
    C: { ref: 4, offs: [-3, -2, -3, -1,  0, null] },
    A: { ref: 4, offs: [ 0,  2,  2,  2,  0, null] },
    G: { ref: 5, offs: [ 0, -3, -3, -3, -1,  0] },
    E: { ref: 5, offs: [ 0,  0,  1,  2,  2,  0] },
    D: { ref: 3, offs: [ 2,  3,  2,  0, null, null] },
  };
  const CAGED_MINOR = {
    C: { ref: 4, offs: [-4, -2, -3, -2,  0, null] },
    A: { ref: 4, offs: [ 0,  1,  2,  2,  0, null] },
    G: { ref: 5, offs: [ 0, -4, -3, -3, -2,  0] },
    E: { ref: 5, offs: [ 0,  0,  0,  2,  2,  0] },
    D: { ref: 3, offs: [ 1,  3,  2,  0, null, null] },
  };
  const CAGED_ORDER = ['C', 'A', 'G', 'E', 'D'];
  const CAGED_COLORS = { C: '#6fb3a3', A: '#d8a35f', G: '#cf8f8f', E: '#8fa9d6', D: '#a9c98b' };

  // one colour per distinct chord root, assigned in progression order
  const ROOT_PALETTE = ['#6fb3a3', '#d8a35f', '#c98b8b', '#8fa9d6', '#a9c98b', '#c69dd2', '#7ec8c0'];

  let fretMode = 'roots';        // 'roots' | 'caged'
  let cagedChordIdx = 0;
  let cagedShapesShown = [];
  let rootLegendData = [];

  const fretModeGroup = document.getElementById('fretModeGroup');
  const cagedChordRow = document.getElementById('cagedChordRow');
  const cagedChordGroup = document.getElementById('cagedChordGroup');
  const cagedLegend = document.getElementById('cagedLegend');
  const fretboardSvg = document.getElementById('fretboard');

  fretModeGroup.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      fretModeGroup.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      fretMode = btn.dataset.value;
      updateFretUI();
      renderFretboard();
    });
  });

  function updateFretUI(){
    cagedChordRow.hidden = fretMode === 'roots';
  }

  function rebuildCagedPicker(){
    const cands = currentProgression.filter(c => c.quality !== 'dim');
    if (cagedChordIdx >= cands.length) cagedChordIdx = 0;
    cagedChordGroup.innerHTML = '';
    cands.forEach((chord, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg-btn' + (i === cagedChordIdx ? ' active' : '');
      b.textContent = chord.name;
      b.addEventListener('click', () => {
        cagedChordIdx = i;
        cagedChordGroup.querySelectorAll('.seg-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        renderFretboard();
      });
      cagedChordGroup.appendChild(b);
    });
  }

  // every CAGED shape placement that fits on the neck, with its played cells
  function cagedPlacements(rootPc, shapeSet){
    const out = [];
    CAGED_ORDER.forEach(name => {
      const shape = shapeSet[name];
      const r0 = ((rootPc - STRING_TUNING[shape.ref]) % 12 + 12) % 12;
      [r0, r0 + 12].forEach(r => {
        const frets = shape.offs.map(o => o === null ? null : r + o);
        if (frets.some(f => f !== null && (f < 0 || f > FRET_COUNT))) return;
        const cells = [];
        frets.forEach((f, s) => { if (f !== null) cells.push({ string: s, fret: f }); });
        const fs = cells.map(c => c.fret);
        out.push({
          name, cells,
          meanFret: fs.reduce((a, b) => a + b, 0) / fs.length,
          fretMin: Math.min(...fs),
          fretMax: Math.max(...fs),
        });
      });
    });
    return out;
  }

  // pentatonic "box" templates, one per CAGED position: two fret offsets per
  // string (index 0 = high e ... 5 = low E) relative to the box's anchor fret
  // on the low-E string. `a` is that anchor for a root pitch-class of 0.
  const PENTA_MAJOR = {
    E: { a: 8,  offs: [[0, 2], [0, 2], [-1, 1], [-1, 2], [-1, 2], [0, 2]] },
    D: { a: 10, offs: [[0, 2], [0, 3], [-1, 2], [0, 2], [0, 2], [0, 2]] },
    C: { a: 12, offs: [[0, 3], [1, 3], [0, 2], [0, 2], [0, 3], [0, 3]] },
    A: { a: 3,  offs: [[0, 2], [0, 2], [-1, 2], [-1, 2], [0, 2], [0, 2]] },
    G: { a: 5,  offs: [[0, 3], [0, 3], [0, 2], [0, 2], [0, 2], [0, 3]] },
  };
  const PENTA_MINOR = {
    E: { a: 8,  offs: [[0, 3], [0, 3], [0, 2], [0, 2], [0, 2], [0, 3]] },
    D: { a: 11, offs: [[0, 2], [0, 2], [-1, 1], [-1, 2], [-1, 2], [0, 2]] },
    C: { a: 1,  offs: [[0, 2], [0, 3], [-1, 2], [0, 2], [0, 2], [0, 2]] },
    A: { a: 3,  offs: [[0, 3], [1, 3], [0, 2], [0, 2], [0, 3], [0, 3]] },
    G: { a: 6,  offs: [[0, 2], [0, 2], [-1, 2], [-1, 2], [0, 2], [0, 2]] },
  };

  // every pentatonic box placement that touches the neck (including partial
  // boxes near the nut / 15th fret); a note may belong to two adjacent boxes
  function pentaBoxPlacements(rootPc, isMinor){
    const set = isMinor ? PENTA_MINOR : PENTA_MAJOR;
    const out = [];
    CAGED_ORDER.forEach(name => {
      const box = set[name];
      const base = (((box.a + rootPc) % 12) + 12) % 12;
      [base - 12, base, base + 12].forEach(anchor => {
        const cells = [];
        box.offs.forEach((pair, s) => {
          pair.forEach(o => {
            const fret = anchor + o;
            if (fret >= 0 && fret <= FRET_COUNT) cells.push({ string: s, fret });
          });
        });
        if (cells.length) out.push({ name, anchor, cells });
      });
    });
    return out;
  }

  function computeFretData(){
    if (!currentProgression.length) return { markers: [], lines: [] };

    if (fretMode === 'penta'){
      const cands = currentProgression.filter(c => c.quality !== 'dim');
      const chord = cands[Math.min(cagedChordIdx, cands.length - 1)];
      if (!chord) return { markers: [], lines: [] };
      const rootPc = SEMITONE[chord.note] % 12;
      const isMinor = chord.quality === 'min';
      const scale = isMinor
        ? [[0, '1'], [3, '♭3'], [5, '4'], [7, '5'], [10, '♭7']]   // minor pentatonic
        : [[0, '1'], [2, '2'], [4, '3'], [7, '5'], [9, '6']];               // major pentatonic
      const degByPc = {};
      scale.forEach(([off, deg]) => { degByPc[(rootPc + off) % 12] = deg; });

      const placements = pentaBoxPlacements(rootPc, isMinor);
      cagedShapesShown = CAGED_ORDER.filter(n => placements.some(p => p.name === n));

      // lines trace each CAGED chord shape (root / 3rd / 5th), one note per
      // string, following the actual fingering — same as "CAGED chords" mode
      const lines = cagedPlacements(rootPc, isMinor ? CAGED_MINOR : CAGED_MAJOR)
        .filter(p => p.cells.length > 1)
        .map(p => ({ color: CAGED_COLORS[p.name], cells: p.cells.map(c => ({ string: c.string, fret: c.fret })) }));

      // every pentatonic note is coloured by the CAGED box(es) that actually
      // contain it: notes shared by two adjacent boxes get a split dot
      // (left half = lower box, right half = higher box)
      const markers = [];
      for (let s = 0; s < 6; s++){
        for (let f = 0; f <= FRET_COUNT; f++){
          const pc = (STRING_TUNING[s] + f) % 12;
          if (!(pc in degByPc)) continue;
          const owners = placements.filter(p => p.cells.some(c => c.string === s && c.fret === f));
          const base = { string: s, fret: f, label: degByPc[pc], isRoot: pc === rootPc };
          if (owners.length >= 2){
            const two = owners.slice()
              .sort((a, b) => Math.abs(f - a.anchor) - Math.abs(f - b.anchor))
              .slice(0, 2)
              .sort((a, b) => a.anchor - b.anchor);
            markers.push({ ...base, split: [CAGED_COLORS[two[0].name], CAGED_COLORS[two[1].name]] });
          } else if (owners.length === 1){
            markers.push({ ...base, color: CAGED_COLORS[owners[0].name] });
          } else {
            let best = null, bd = Infinity;
            placements.forEach(p => { const d = Math.abs(f - p.anchor); if (d < bd){ bd = d; best = p; } });
            markers.push({ ...base, color: best ? CAGED_COLORS[best.name] : '#6b655b' });
          }
        }
      }
      return { markers, lines };
    }

    if (fretMode === 'roots'){
      const pcName = {};
      const pcNum = {};
      const order = [];
      currentProgression.forEach(c => {
        const pc = SEMITONE[c.note] % 12;
        if (!(pc in pcName)){ pcName[pc] = c.note; pcNum[pc] = c.numeral; order.push(pc); }
      });
      const pcColor = {};
      order.forEach((pc, i) => { pcColor[pc] = ROOT_PALETTE[i % ROOT_PALETTE.length]; });
      rootLegendData = order.map(pc => ({ name: pcName[pc], num: pcNum[pc], color: pcColor[pc] }));

      const markers = [];
      for (let s = 0; s < 6; s++){
        for (let f = 0; f <= FRET_COUNT; f++){
          const pc = (STRING_TUNING[s] + f) % 12;
          if (pc in pcName) markers.push({ string: s, fret: f, color: pcColor[pc], label: pcName[pc], isRoot: false });
        }
      }
      return { markers, lines: [] };
    }

    const cands = currentProgression.filter(c => c.quality !== 'dim');
    const chord = cands[Math.min(cagedChordIdx, cands.length - 1)];
    if (!chord) return { markers: [], lines: [] };
    const rootPc = SEMITONE[chord.note] % 12;
    const thirdPc = SEMITONE[chord.third] % 12;
    const fifthPc = SEMITONE[chord.fifth] % 12;
    const nameOf = pc =>
      pc === rootPc ? chord.note :
      pc === thirdPc ? chord.third :
      pc === fifthPc ? chord.fifth : '';
    const shapes = chord.quality === 'min' ? CAGED_MINOR : CAGED_MAJOR;

    const cells = new Map();
    const rendered = new Set();
    const lines = [];
    CAGED_ORDER.forEach(name => {
      const shape = shapes[name];
      const r0 = ((rootPc - STRING_TUNING[shape.ref]) % 12 + 12) % 12;
      [r0, r0 + 12].forEach(r => {
        const frets = shape.offs.map(o => o === null ? null : r + o);
        if (frets.some(f => f !== null && (f < 0 || f > FRET_COUNT))) return;
        rendered.add(name);
        const played = frets.filter(f => f !== null);
        const meanFret = played.reduce((a, b) => a + b, 0) / played.length;
        const lineCells = [];
        frets.forEach((f, s) => {
          if (f === null) return;
          lineCells.push({ string: s, fret: f });
          const key = s + ':' + f;
          if (!cells.has(key)){
            cells.set(key, { string: s, fret: f, contribs: [],
              isRoot: (STRING_TUNING[s] + f) % 12 === rootPc });
          }
          cells.get(key).contribs.push({ name, meanFret });
        });
        if (lineCells.length > 1) lines.push({ color: CAGED_COLORS[name], cells: lineCells });
      });
    });
    cagedShapesShown = CAGED_ORDER.filter(n => rendered.has(n));

    const markers = [...cells.values()].map(m => {
      const label = nameOf((STRING_TUNING[m.string] + m.fret) % 12);
      const names = [...new Set(m.contribs.map(c => c.name))];
      if (names.length === 1){
        return { string: m.string, fret: m.fret, isRoot: m.isRoot, label,
          color: CAGED_COLORS[names[0]] };
      }
      // shared note: order the two shapes left-to-right by their position on the neck
      const sorted = [...m.contribs].sort((a, b) => a.meanFret - b.meanFret);
      const left = sorted[0].name;
      const right = [...sorted].reverse().find(c => c.name !== left).name;
      return { string: m.string, fret: m.fret, isRoot: m.isRoot, label,
        split: [CAGED_COLORS[left], CAGED_COLORS[right]] };
    });
    return { markers, lines };
  }

  function renderFretLegend(){
    if (fretMode === 'roots'){
      cagedLegend.innerHTML = rootLegendData
        .map(r => `<span><i style="background:${r.color}"></i>${r.name}<em>${r.num}</em></span>`)
        .join('');
      return;
    }
    const parts = cagedShapesShown.map(n =>
      `<span><i style="background:${CAGED_COLORS[n]}"></i>${n} shape</span>`);
    parts.push(`<span><i class="ring"></i>root</span>`);
    if (fretMode === 'penta'){
      parts.push(`<span>split dot = shared by two boxes</span>`);
      parts.push(`<span>lines trace chord tones</span>`);
    } else {
      parts.push(`<span>split dot = shared by two shapes</span>`);
    }
    cagedLegend.innerHTML = parts.join('');
  }

  function renderFretboard(){
    const W = 520, H = 172;
    const padL = 44, padR = 12, padT = 14, padB = 22;
    const nutX = padL + 12;
    const cellW = (W - nutX - padR) / FRET_COUNT;
    const rowH = (H - padT - padB) / 5;
    const stringY = s => padT + s * rowH;
    const wireX = f => nutX + f * cellW;
    const fretX = f => f === 0 ? nutX - 11 : nutX + (f - 0.5) * cellW;

    const els = [];
    for (let s = 0; s < 6; s++){
      els.push(`<line class="fret-string" x1="${nutX}" y1="${stringY(s)}" x2="${W - padR}" y2="${stringY(s)}"/>`);
      els.push(`<text class="string-label" x="${padL - 10}" y="${stringY(s) + 3}" text-anchor="end">${STRING_LABELS[s]}</text>`);
    }
    els.push(`<line class="fret-nut" x1="${nutX}" y1="${stringY(0)}" x2="${nutX}" y2="${stringY(5)}"/>`);
    for (let f = 1; f <= FRET_COUNT; f++){
      els.push(`<line class="fret-wire" x1="${wireX(f)}" y1="${stringY(0)}" x2="${wireX(f)}" y2="${stringY(5)}"/>`);
    }
    [3, 5, 7, 9, 15].forEach(f =>
      els.push(`<circle class="fret-inlay" cx="${fretX(f)}" cy="${padT + 2.5 * rowH}" r="3.6"/>`));
    els.push(`<circle class="fret-inlay" cx="${fretX(12)}" cy="${padT + 1.5 * rowH}" r="3.6"/>`);
    els.push(`<circle class="fret-inlay" cx="${fretX(12)}" cy="${padT + 3.5 * rowH}" r="3.6"/>`);
    [3, 5, 7, 9, 12, 15].forEach(f =>
      els.push(`<text class="fret-num" x="${fretX(f)}" y="${H - 6}" text-anchor="middle">${f}</text>`));

    const { markers, lines } = computeFretData();

    lines.forEach(ln => {
      const pts = ln.cells.map(c => `${fretX(c.fret)},${stringY(c.string)}`).join(' ');
      els.push(`<polyline class="shape-line" points="${pts}" stroke="${ln.color}"/>`);
    });

    markers.forEach(m => {
      const cx = fretX(m.fret), cy = stringY(m.string), r = m.dim ? 7 : 8.5;
      let g = `<g class="note-dot${m.dim ? ' dim' : ''}">`;
      if (m.split){
        // left half = left shape's colour, right half = right shape's colour
        g += `<path d="M${cx},${cy - r} A${r},${r} 0 0 0 ${cx},${cy + r} Z" fill="${m.split[0]}"/>`;
        g += `<path d="M${cx},${cy - r} A${r},${r} 0 0 1 ${cx},${cy + r} Z" fill="${m.split[1]}"/>`;
      } else {
        g += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${m.color}"/>`;
      }
      if (m.isRoot) g += `<circle class="dot-ring" cx="${cx}" cy="${cy}" r="${r}" fill="none"/>`;
      if (m.label) g += `<text x="${cx}" y="${cy + 3}" text-anchor="middle">${m.label}</text>`;
      g += '</g>';
      els.push(g);
    });

    fretboardSvg.innerHTML = els.join('');
    renderFretLegend();
  }

  function getTempo(){ return Number(tempoInput.value); }
  function getBeatsPerChord(){ return measuresPerChord * 4; } // assumes 4/4 time
  function getNoteBeats(){ return noteBeats; } // 1 = quarter, 2 = half, 4 = whole

  tempoInput.addEventListener('input', () => {
    tempoVal.textContent = `${getTempo()} BPM`;
  });

  let isPlaying = false;
  let schedulerId = null;
  let nextNoteTime = 0;
  let chordIdx = 0;
  let beatInChord = 0;
  let scheduledLog = []; // {idx, time} for syncing the visual highlight
  let playbackStartTime = 0; // audioCtx time of the first chord (after any count-in)
  let countInFrom = 0;       // audioCtx time of the first count-in click
  let countInSpb = 0;        // seconds per beat during the count-in

  function setPlayLabel(text){
    playBtn.textContent = text;
    playBtn2.textContent = text;
  }

  function resetPlaybackCursor(){
    chordIdx = 0;
    beatInChord = 0;
    scheduledLog = [];
    document.querySelectorAll('.chord').forEach(el => el.classList.remove('dim', 'active'));
    measureReadout.textContent = '';
  }

  const LOOKAHEAD_MS = 25;
  const SCHEDULE_AHEAD_SEC = 0.12;

  function scheduler(){
    while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD_SEC){
      const chord = currentProgression[chordIdx];
      const secondsPerBeat = 60 / getTempo();
      const noteBeats = getNoteBeats();
      const beatInMeasure = beatInChord % 4;
      const isDownbeat = beatInMeasure === 0;
      const shouldTrigger = beatInMeasure % noteBeats === 0;

      if (chord && shouldTrigger){
        const interval = secondsPerBeat * noteBeats;
        const duration = Math.min(interval * 2.3, 2.6 * noteBeats);
        const velocity = isDownbeat ? 1 : 0.62;
        if (rootOnlyToggle.checked){
          // boost the lone root so it sits at a similar loudness to a full triad
          playNote(noteFreq(chord.note, ROOT_OCTAVE), nextNoteTime, duration, velocity * 1.9);
        } else {
          playChord(chord, nextNoteTime, duration, velocity);
        }
        scheduledLog.push({
          idx: chordIdx, time: nextNoteTime,
          measure: Math.floor(beatInChord / 4) + 1,
          beat: (beatInChord % 4) + 1,
        });
      }

      if (clickToggle.checked){
        playHiHat(nextNoteTime);
      }

      nextNoteTime += secondsPerBeat;
      beatInChord++;
      if (beatInChord >= getBeatsPerChord()){
        beatInChord = 0;
        chordIdx = (chordIdx + 1) % currentProgression.length;
      }
    }
    schedulerId = setTimeout(scheduler, LOOKAHEAD_MS);
  }

  function syncHighlight(){
    if (!isPlaying) return;
    const now = audioCtx.currentTime;

    // during the count-in, show the running beat number where the
    // measure.beat readout normally sits
    if (now < playbackStartTime - 0.0005){
      const b = Math.min(4, Math.max(1, Math.floor((now - countInFrom) / countInSpb) + 1));
      measureReadout.textContent = String(b);
      requestAnimationFrame(syncHighlight);
      return;
    }

    while (scheduledLog.length > 1 && scheduledLog[1].time <= now){
      scheduledLog.shift();
    }
    const active = scheduledLog[0];
    if (active){
      document.querySelectorAll('.chord').forEach((el, i) => {
        const isActive = i === active.idx;
        el.classList.toggle('active', isActive);
        el.classList.toggle('dim', !isActive);
      });
      measureReadout.textContent =
        `${Math.min(active.measure, measuresPerChord)}.${active.beat}`;
    }
    requestAnimationFrame(syncHighlight);
  }

  function togglePlay(){
    ensureAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (!isPlaying){
      isPlaying = true;
      resetPlaybackCursor();
      nextNoteTime = audioCtx.currentTime + 0.05;
      countInSpb = 60 / getTempo();
      countInFrom = nextNoteTime;
      if (countInToggle.checked){
        for (let i = 0; i < 4; i++) playHiHat(nextNoteTime + i * countInSpb);
        nextNoteTime += 4 * countInSpb;
      }
      playbackStartTime = nextNoteTime;
      scheduler();
      requestAnimationFrame(syncHighlight);
      setPlayLabel('Pause');
    } else {
      isPlaying = false;
      clearTimeout(schedulerId);
      document.querySelectorAll('.chord').forEach(el => el.classList.remove('dim', 'active'));
      measureReadout.textContent = '';
      setPlayLabel('Play');
    }
  }

  playBtn.addEventListener('click', togglePlay);
  playBtn2.addEventListener('click', togglePlay);

  updateFretUI();
  render();
</script>

</body>
</html>
