<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Progression Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5f5f1;
    --ink: #232220;
    --muted: #918b7d;
    --accent: #2f5d50;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    min-height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .wrap{
    width:100%;
    max-width: 640px;
    padding: 56px 24px;
    text-align:center;
  }

  .key{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size: clamp(1.15rem, 3vw, 1.4rem);
    color: var(--muted);
    margin: 0 0 44px;
  }

  .chords{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    flex-wrap:nowrap;
    gap: clamp(14px, 4vw, 44px);
  }
  .chords.tight{
    gap: clamp(8px, 2vw, 20px);
  }

  .chord{
    flex: 1 1 0;
    min-width:0;
    font-size: clamp(1.1rem, calc(22vw / var(--n, 4)), 2.5rem);
    opacity:0;
    animation: fade 0.4s ease forwards;
  }

  .chord-name{
    display:block;
    font-family:'Fraunces', serif;
    font-weight:600;
    line-height:1;
    letter-spacing: -0.01em;
  }

  .chord-numeral{
    display:block;
    margin-top: 0.28em;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-style: italic;
    font-size: 1em;
    line-height:1;
    color: var(--accent);
    letter-spacing: 0.01em;
  }

  @keyframes fade{
    from{ opacity:0; transform: translateY(4px); }
    to{ opacity:1; transform: translateY(0); }
  }

  button{
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 0.88rem;
    color: var(--accent);
    background: transparent;
    border: 1.5px solid var(--accent);
    border-radius: 7px;
    padding: 9px 18px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button:hover{
    background: var(--accent);
    color: #fff;
  }
  button:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .chord{
    border-bottom: 2px solid transparent;
    padding-bottom: 10px;
    transition: opacity 0.15s ease, border-color 0.15s ease;
  }
  .chord.dim{
    opacity: 0.32;
  }
  .chord.active{
    border-bottom-color: var(--accent);
  }

  input[type="checkbox"]{
    width: 22px;
    height: 22px;
    accent-color: var(--accent);
  }

  .stepper{
    display:flex;
    align-items:center;
    gap: 14px;
  }

  .step-btn{
    width: 42px;
    height: 42px;
    padding: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1.2rem;
    line-height:1;
  }

  .step-value{
    min-width: 20px;
    text-align:center;
    font-weight:600;
    font-variant-numeric: tabular-nums;
  }

  .segmented{
    display:flex;
    gap: 8px;
  }

  .seg-btn{
    padding: 10px 14px;
  }

  .seg-btn.active{
    background: var(--accent);
    color: #fff;
  }

  .top-controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap: 20px;
    margin-bottom: 40px;
  }

  .playback-controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap: 32px;
    margin-top: 34px;
  }

  .field{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 6px;
  }

  .field-label{
    font-size: 0.78rem;
    color: var(--muted);
  }

  .field-value{
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"]{
    width: 140px;
    accent-color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce){
    .chord{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-controls">
    <button id="genBtn">New progression</button>

    <div class="field">
      <span class="field-label">Chords</span>
      <div class="stepper">
        <button type="button" class="step-btn" id="chordCountDown" aria-label="Fewer chords">−</button>
        <span class="step-value" id="chordCountValue">3</span>
        <button type="button" class="step-btn" id="chordCountUp" aria-label="More chords">+</button>
      </div>
    </div>

    <label class="field field-checkbox">
      <span class="field-label">Common chords</span>
      <input type="checkbox" id="commonToggle" checked>
    </label>
  </div>

  <p class="key" id="keyReadout">Key of —</p>

  <div class="chords" id="chords"></div>

  <div class="playback-controls">
    <button id="playBtn">Play</button>

    <label class="field">
      <span class="field-label">Tempo</span>
      <input type="range" id="tempo" min="40" max="200" value="60">
      <span class="field-value" id="tempoVal">60 BPM</span>
    </label>

    <div class="field">
      <span class="field-label">Measures per chord</span>
      <div class="stepper">
        <button type="button" class="step-btn" id="measuresDown" aria-label="Fewer measures per chord">−</button>
        <span class="step-value" id="measuresValue">2</span>
        <button type="button" class="step-btn" id="measuresUp" aria-label="More measures per chord">+</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Note value</span>
      <div class="segmented" id="noteValueGroup">
        <button type="button" class="seg-btn active" data-value="1">Quarter</button>
        <button type="button" class="seg-btn" data-value="2">Half</button>
        <button type="button" class="seg-btn" data-value="4">Whole</button>
      </div>
    </div>

    <label class="field field-checkbox">
      <span class="field-label">Click</span>
      <input type="checkbox" id="clickToggle">
    </label>

    <label class="field field-checkbox">
      <span class="field-label">Roots only</span>
      <input type="checkbox" id="rootOnlyToggle">
    </label>
  </div>
</div>

<script>
  const MAJOR_KEYS = {
    'C':  ['C','D','E','F','G','A','B'],
    'G':  ['G','A','B','C','D','E','F#'],
    'D':  ['D','E','F#','G','A','B','C#'],
    'A':  ['A','B','C#','D','E','F#','G#'],
    'E':  ['E','F#','G#','A','B','C#','D#'],
    'B':  ['B','C#','D#','E','F#','G#','A#'],
    'Gb': ['Gb','Ab','Bb','Cb','Db','Eb','F'],
    'Db': ['Db','Eb','F','Gb','Ab','Bb','C'],
    'Ab': ['Ab','Bb','C','Db','Eb','F','G'],
    'Eb': ['Eb','F','G','Ab','Bb','C','D'],
    'Bb': ['Bb','C','D','Eb','F','G','A'],
    'F':  ['F','G','A','Bb','C','D','E'],
  };

  const MINOR_KEYS = {
    'A':  ['A','B','C','D','E','F','G'],
    'E':  ['E','F#','G','A','B','C','D'],
    'B':  ['B','C#','D','E','F#','G','A'],
    'F#': ['F#','G#','A','B','C#','D','E'],
    'C#': ['C#','D#','E','F#','G#','A','B'],
    'G#': ['G#','A#','B','C#','D#','E','F#'],
    'Eb': ['Eb','F','Gb','Ab','Bb','Cb','Db'],
    'Bb': ['Bb','C','Db','Eb','F','Gb','Ab'],
    'F':  ['F','G','Ab','Bb','C','Db','Eb'],
    'C':  ['C','D','Eb','F','G','Ab','Bb'],
    'G':  ['G','A','Bb','C','D','Eb','F'],
    'D':  ['D','E','F','G','A','Bb','C'],
  };

  const MAJOR_QUALITY  = ['maj','min','min','maj','maj','min','dim'];
  const MAJOR_NUMERALS = ['I','ii','iii','IV','V','vi','vii°'];
  const MINOR_QUALITY  = ['min','dim','maj','min','min','maj','maj'];
  const MINOR_NUMERALS = ['i','ii°','III','iv','v','VI','VII'];
  const SUFFIX = { maj: '', min: 'm', dim: '°' };

  // raised 7th (leading tone) of each minor key, used to turn v into V
  const LEADING_TONE = {
    'A': 'G#', 'E': 'D#', 'B': 'A#', 'F#': 'E#', 'C#': 'B#', 'G#': 'G',
    'Eb': 'D', 'Bb': 'A', 'F': 'E', 'C': 'B', 'G': 'F#', 'D': 'C#',
  };

  // scale-degree indices kept when "common chords only" is on
  const MAJOR_COMMON = [0, 1, 3, 4, 5];   // I, ii, IV, V, vi
  const MINOR_COMMON = [0, 3, 4, 5, 6];   // i, iv, v/V, VI, VII

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildDiatonicChords(mode, tonic){
    const scale = mode === 'major' ? MAJOR_KEYS[tonic] : MINOR_KEYS[tonic];
    const qualities = mode === 'major' ? MAJOR_QUALITY : MINOR_QUALITY;
    const numerals = mode === 'major' ? MAJOR_NUMERALS : MINOR_NUMERALS;
    return scale.map((note, i) => ({
      note,
      third: scale[(i + 2) % 7],
      fifth: scale[(i + 4) % 7],
      quality: qualities[i],
      numeral: numerals[i],
      name: note + SUFFIX[qualities[i]],
    }));
  }

  function generateProgression(commonOnly, requestedCount){
    const mode = Math.random() < 0.5 ? 'major' : 'minor';
    const keys = Object.keys(mode === 'major' ? MAJOR_KEYS : MINOR_KEYS);
    const tonic = pick(keys);
    const chords = buildDiatonicChords(mode, tonic);

    if (mode === 'minor' && Math.random() < 0.5){
      // swap the natural-minor v for the major dominant V (harmonic minor)
      const five = chords[4];
      chords[4] = {
        note: five.note,
        third: LEADING_TONE[tonic],
        fifth: five.fifth,
        quality: 'maj',
        numeral: 'V',
        name: five.note,
      };
    }

    const commonIndices = mode === 'major' ? MAJOR_COMMON : MINOR_COMMON;
    const pool = commonOnly ? chords.filter((_, i) => commonIndices.includes(i)) : chords;

    const root = pool[0];                  // always the tonic (I or i)
    const others = shuffle(pool.slice(1));  // the other diatonic triads in the pool
    const count = Math.max(1, Math.min(requestedCount, pool.length));
    const selected = others.slice(0, count - 1);
    const progression = shuffle([root, ...selected]);

    return { mode, tonic, progression };
  }

  let currentProgression = [];
  let chordCount = 3;

  function render(){
    const { mode, tonic, progression } = generateProgression(commonToggle.checked, chordCount);
    currentProgression = progression;

    document.getElementById('keyReadout').textContent =
      `Key of ${tonic} ${mode === 'major' ? 'major' : 'minor'}`;

    const chordsEl = document.getElementById('chords');
    chordsEl.style.setProperty('--n', progression.length);
    chordsEl.classList.toggle('tight', progression.length === 2);
    chordsEl.innerHTML = '';
    progression.forEach((chord, i) => {
      const item = document.createElement('div');
      item.className = 'chord';
      item.style.animationDelay = `${i * 70}ms`;
      item.innerHTML = `
        <span class="chord-name">${chord.name}</span>
        <span class="chord-numeral">${chord.numeral}</span>
      `;
      chordsEl.appendChild(item);
    });

    // keep the playback loop in sync with the new set of chords
    resetPlaybackCursor();
  }

  document.getElementById('genBtn').addEventListener('click', render);

  // ---------- Playback ----------

  const SEMITONE = {
    C:0, 'C#':1, Db:1, D:2, 'D#':3, Eb:3, E:4, 'E#':5, F:5,
    'F#':6, Gb:6, G:7, 'G#':8, Ab:8, A:9, 'A#':10, Bb:10, B:11, 'B#':0, Cb:11,
  };
  const ROOT_OCTAVE = 3;

  function noteFreq(name, octave){
    const midi = (octave + 1) * 12 + SEMITONE[name];
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function chordFrequencies(chord){
    // stack root/third/fifth upward in pitch, wrapping octaves as needed
    const rootSemi = SEMITONE[chord.note];
    const thirdSemi = SEMITONE[chord.third];
    const fifthSemi = SEMITONE[chord.fifth];

    const thirdOctave = ROOT_OCTAVE + (thirdSemi <= rootSemi ? 1 : 0);
    const fifthOctave = thirdOctave + (fifthSemi <= thirdSemi ? 1 : 0);

    return [
      noteFreq(chord.note, ROOT_OCTAVE),
      noteFreq(chord.third, thirdOctave),
      noteFreq(chord.fifth, fifthOctave),
    ];
  }

  let audioCtx = null;
  let masterGain = null;
  let hihatGain = null;
  let noiseBuffer = null;

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.3;
      const tone = audioCtx.createBiquadFilter();
      tone.type = 'lowpass';
      tone.frequency.value = 3200;
      tone.Q.value = 0.7;
      masterGain.connect(tone);
      tone.connect(audioCtx.destination);

      // separate percussion chain so the hi-hat's high end isn't
      // swallowed by the piano voice's lowpass filter
      hihatGain = audioCtx.createGain();
      hihatGain.gain.value = 0.45;
      hihatGain.connect(audioCtx.destination);

      const bufferSize = Math.floor(audioCtx.sampleRate * 0.2);
      noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++){
        data[i] = Math.random() * 2 - 1;
      }
    }
  }

  // simple additive "piano" tone: a handful of decaying harmonics
  const HARMONICS = [
    { mult: 1, gain: 0.50 },
    { mult: 2, gain: 0.28 },
    { mult: 3, gain: 0.13 },
    { mult: 4, gain: 0.06 },
    { mult: 5, gain: 0.03 },
  ];

  function playNote(freq, time, duration, velocity){
    const envelope = audioCtx.createGain();
    envelope.gain.setValueAtTime(0.0001, time);
    envelope.gain.exponentialRampToValueAtTime(0.85 * velocity, time + 0.006);
    envelope.gain.exponentialRampToValueAtTime(0.0001, time + duration);
    envelope.connect(masterGain);

    HARMONICS.forEach(h => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq * h.mult;
      const hGain = audioCtx.createGain();
      hGain.gain.value = h.gain;
      osc.connect(hGain).connect(envelope);
      osc.start(time);
      osc.stop(time + duration + 0.05);
    });
  }

  function playChord(chord, time, duration, velocity){
    chordFrequencies(chord).forEach(freq => playNote(freq, time, duration, velocity));
  }

  function playHiHat(time){
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;

    const highpass = audioCtx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 8000;

    const envelope = audioCtx.createGain();
    envelope.gain.setValueAtTime(0.0001, time);
    envelope.gain.exponentialRampToValueAtTime(1, time + 0.002);
    envelope.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);

    src.connect(highpass).connect(envelope).connect(hihatGain);
    src.start(time);
    src.stop(time + 0.08);
  }

  const tempoInput = document.getElementById('tempo');
  const tempoVal = document.getElementById('tempoVal');
  const playBtn = document.getElementById('playBtn');
  const commonToggle = document.getElementById('commonToggle');
  const clickToggle = document.getElementById('clickToggle');
  const rootOnlyToggle = document.getElementById('rootOnlyToggle');

  const chordCountValue = document.getElementById('chordCountValue');
  const measuresValue = document.getElementById('measuresValue');

  let measuresPerChord = 2;
  let noteBeats = 1;

  commonToggle.addEventListener('change', render);

  function setChordCount(n){
    chordCount = Math.max(2, Math.min(7, n));
    chordCountValue.textContent = chordCount;
    render();
  }
  document.getElementById('chordCountDown').addEventListener('click', () => {
    if (chordCount <= 2) return;
    setChordCount(chordCount - 1);
  });
  document.getElementById('chordCountUp').addEventListener('click', () => {
    if (chordCount >= 7) return;
    setChordCount(chordCount + 1);
  });

  function setMeasures(n){
    measuresPerChord = Math.max(1, Math.min(8, n));
    measuresValue.textContent = measuresPerChord;
  }
  document.getElementById('measuresDown').addEventListener('click', () => setMeasures(measuresPerChord - 1));
  document.getElementById('measuresUp').addEventListener('click', () => setMeasures(measuresPerChord + 1));

  document.querySelectorAll('#noteValueGroup .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#noteValueGroup .seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      noteBeats = Number(btn.dataset.value);
    });
  });

  function getTempo(){ return Number(tempoInput.value); }
  function getBeatsPerChord(){ return measuresPerChord * 4; } // assumes 4/4 time
  function getNoteBeats(){ return noteBeats; } // 1 = quarter, 2 = half, 4 = whole

  tempoInput.addEventListener('input', () => {
    tempoVal.textContent = `${getTempo()} BPM`;
  });

  let isPlaying = false;
  let schedulerId = null;
  let nextNoteTime = 0;
  let chordIdx = 0;
  let beatInChord = 0;
  let scheduledLog = []; // {idx, time} for syncing the visual highlight

  function resetPlaybackCursor(){
    chordIdx = 0;
    beatInChord = 0;
    scheduledLog = [];
    document.querySelectorAll('.chord').forEach(el => el.classList.remove('dim', 'active'));
  }

  const LOOKAHEAD_MS = 25;
  const SCHEDULE_AHEAD_SEC = 0.12;

  function scheduler(){
    while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD_SEC){
      const chord = currentProgression[chordIdx];
      const secondsPerBeat = 60 / getTempo();
      const noteBeats = getNoteBeats();
      const beatInMeasure = beatInChord % 4;
      const isDownbeat = beatInMeasure === 0;
      const shouldTrigger = beatInMeasure % noteBeats === 0;

      if (chord && shouldTrigger){
        const interval = secondsPerBeat * noteBeats;
        const duration = Math.min(interval * 2.3, 2.6 * noteBeats);
        const velocity = isDownbeat ? 1 : 0.62;
        if (rootOnlyToggle.checked){
          playNote(noteFreq(chord.note, ROOT_OCTAVE), nextNoteTime, duration, velocity);
        } else {
          playChord(chord, nextNoteTime, duration, velocity);
        }
        scheduledLog.push({ idx: chordIdx, time: nextNoteTime });
      }

      if (clickToggle.checked){
        playHiHat(nextNoteTime);
      }

      nextNoteTime += secondsPerBeat;
      beatInChord++;
      if (beatInChord >= getBeatsPerChord()){
        beatInChord = 0;
        chordIdx = (chordIdx + 1) % currentProgression.length;
      }
    }
    schedulerId = setTimeout(scheduler, LOOKAHEAD_MS);
  }

  function syncHighlight(){
    if (!isPlaying) return;
    const now = audioCtx.currentTime;
    while (scheduledLog.length > 1 && scheduledLog[1].time <= now){
      scheduledLog.shift();
    }
    const active = scheduledLog[0];
    if (active){
      document.querySelectorAll('.chord').forEach((el, i) => {
        const isActive = i === active.idx;
        el.classList.toggle('active', isActive);
        el.classList.toggle('dim', !isActive);
      });
    }
    requestAnimationFrame(syncHighlight);
  }

  function togglePlay(){
    ensureAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (!isPlaying){
      isPlaying = true;
      resetPlaybackCursor();
      nextNoteTime = audioCtx.currentTime + 0.05;
      scheduler();
      requestAnimationFrame(syncHighlight);
      playBtn.textContent = 'Pause';
    } else {
      isPlaying = false;
      clearTimeout(schedulerId);
      document.querySelectorAll('.chord').forEach(el => el.classList.remove('dim', 'active'));
      playBtn.textContent = 'Play';
    }
  }

  playBtn.addEventListener('click', togglePlay);

  render();
</script>

</body>
</html>
